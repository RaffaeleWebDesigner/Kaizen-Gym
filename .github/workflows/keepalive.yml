# Il piano gratuito di Supabase mette in pausa il progetto dopo 7 giorni senza attività.
# Questo controllo lo "tocca" ogni 3 giorni. URL e chiave publishable sono pubblici per design.
name: Supabase sveglio

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al database
        run: |
          curl -fsS -X POST "https://kvrkitxxfqqtakwcwgdd.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_jfMVXGwIxhojngdb_ZFU7g_o7eWJv2j" \
            -H "Content-Type: application/json" -d '{}'
